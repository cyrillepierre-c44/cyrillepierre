AllCops:
  NewCops: enable
  # Redéfinir `Exclude` écrase la liste par défaut de RuboCop. En CI les gems sont
  # vendorées dans vendor/bundle : sans `vendor/**/*` ci-dessous, RuboCop linte tout
  # Rails et crache des milliers de fausses offenses invisibles en local.
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'
    - 'vendor/**/*'

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
# Les cops Metrics sont désactivés en bloc, comme AbcSize et CyclomaticComplexity l'étaient
# déjà : les méthodes les plus longues de cette app construisent des prompts LLM sous forme de
# heredocs d'une centaine de lignes. Les découper en méthodes de 10 lignes rendrait ces prompts
# illisibles sans rien apporter.
Metrics/MethodLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  Max: 120
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
